<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and home
         indicator like a native app; the CSS below pads content back out with
         env(safe-area-inset-*). user-scalable=no stops a double-tap zooming the
         whole UI, which immediately reads as "this is a web page". -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#8a1538" />

    <!-- iOS ignores the web manifest for standalone mode and needs its own
         tags. Without these, "Add to Home Screen" on an iPhone opens Rihla in a
         Safari tab with the address bar, which is exactly what a website does. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rihla" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Rihla plans your Qatar trip in one conversation — day-by-day Doha itineraries with real venues and prices, bookings, budgets, expenses, and visa guidance. English & العربية."
