# Deploy the company site to Hostinger on every push to main.
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Variables: FTP_SERVER  e.g. ftp.rihlahtc.com
#              FTP_DIR     e.g. /public_html/        (docroot of rihlahtc.com)
#   Secrets:   FTP_USERNAME, FTP_PASSWORD
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ vars.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/app/**
            README.md
